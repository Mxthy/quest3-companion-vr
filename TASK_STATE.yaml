roadmap_decision_2026_09_20: >
  PIVOT (Eva): Endziel ist ein Unity-kompiliertes natives Spiel (Quest APK, Unity 6 +
  OpenXR, Multiview). Die WebXR-App ist eine VORLAEUFIGE DEMO und muss so gebaut werden,
  dass die Engine austauschbar bleibt. Bindend: life-vibe/architecture/platform-adapters -
  Simulation ist das Spiel, WebXR + Unity sind nur Rendering/Input-Clients. Gameplay
  importiert NIEMALS rohe XR-APIs. Phase 2.5: echtes VR im WebXR-Demo (XR-Session,
  Haende/Controller, Locomotion, Comfort) + Core-Refactoring (src/core ohne three.js).

