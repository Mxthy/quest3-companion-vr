name: Deploy Web App to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch VRM model binary (gitignored asset)
        run: |
          mkdir -p public/models
          curl -sL "https://base44.app/api/apps/6aba70fce22831cd934eaf4a/files/mp/public/6aba70fce22831cd934eaf4a/8874b9469_vivi.vrm" -o public/models/vivi.vrm
          test "$(stat -c%s public/models/vivi.vrm)" = "10885460"

      - name: Fetch authored voice clips (gitignored asset)
        run: |
          mkdir -p public/audio/vivi
          curl -sL "https://base44.app/api/apps/6aba70fce22831cd934eaf4a/files/mp/public/6aba70fce22831cd934eaf4a/4baa9dee7_062cad8ff_vivi_dialogue_audio_de_eve.zip" -o /tmp/vivi-voice.zip
          unzip -q -j /tmp/vivi-voice.zip "vivi_dialogue_audio_de_eve/*.mp3" -d public/audio/vivi
          test "$(ls public/audio/vivi | wc -l)" = "122"

      - name: Build production bundle (Cloudflare Pages preset)
        run: NITRO_PRESET=cloudflare_pages VITE_AUTH_ENABLED=true npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=quest-companion --branch=main

      - name: Report deployment
        run: echo "Live at https://quest-companion-dif.pages.dev"
