name: Build Native Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/QuestCompanionNative/**"
      - ".github/workflows/build-native-quest-apk.yml"

permissions:
  contents: read

concurrency:
  group: native-quest-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK: "27.2.12479018"
  ANDROID_CMAKE: "3.22.1"
  GRADLE_VERSION: "8.9"
  NATIVE_PROJECT: native/QuestCompanionNative

jobs:
  build:
    name: Android ARM64 OpenXR bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ${{ env.NATIVE_PROJECT }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging "$APK" \
            | grep -E "package:|native-code:|uses-feature:.*vr.headtracking"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging "$APK" \
            | grep -q "native-code: 'arm64-v8a'"

      - name: Collect unstripped native symbols
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/diagnostics
          SYMBOL="$(find app/build/intermediates/cxx -path '*arm64-v8a/libquest_companion.so' -print -quit)"
          test -n "$SYMBOL"
          cp "$SYMBOL" app/build/diagnostics/libquest_companion-unstripped.so
          cp gradle/libs.versions.toml app/build/diagnostics/toolchain-versions.toml

      - name: Upload APK and diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quest-companion-native-${{ github.run_number }}
          path: |
            native/QuestCompanionNative/app/build/outputs/apk/debug/app-debug.apk
            native/QuestCompanionNative/app/build/outputs/apk/debug/app-debug.apk.sha256
            native/QuestCompanionNative/app/build/diagnostics/libquest_companion-unstripped.so
            native/QuestCompanionNative/app/build/diagnostics/toolchain-versions.toml
          if-no-files-found: error
          retention-days: 14
