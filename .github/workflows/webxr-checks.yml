name: WebXR checks

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/webxr-checks.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/webxr-checks.yml'

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      # package.json and package-lock.json are currently out of sync. npm ci
      # intentionally rejects that state, while npm install reconciles the lock
      # file before the remaining checks run.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:dev
